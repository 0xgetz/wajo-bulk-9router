      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="160" rx="0" fill="#0b0b12"/>
  <!-- mark: a chat bubble feeding a router node -->
  <g transform="translate(28,26)">
    <rect x="0" y="0" width="108" height="108" rx="24" fill="url(#g)" opacity="0.16"/>
    <rect x="6" y="6" width="96" height="96" rx="20" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5"/>
