  <text x="168" y="72" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="40" font-weight="800" fill="#f8fafc">wajo<tspan fill="#a5b4fc">·</tspan>bulk<tspan fill="#a5b4fc">·</tspan>9router</text>
  <text x="169" y="104" font-family="Inter,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="500" fill="#94a3b8">Bulk Wajo AI accounts → one OpenAI-compatible endpoint on 9Router</text>
